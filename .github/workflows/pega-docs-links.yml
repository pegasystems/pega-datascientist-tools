name: Pega docs links

on:
  pull_request:
    paths:
      - examples/articles/**
      - scripts/check_pega_docs_links.py
      - .github/workflows/pega-docs-links.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Check Pega documentation links
        run: uv run --no-project --python 3.13 python scripts/check_pega_docs_links.py
